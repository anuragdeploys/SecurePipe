name: AWS OIDC Test

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  aws-oidc-test:
    name: Verify GitHub to AWS OIDC
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: arn:aws:iam::854469103418:role/SecurePipeGitHubActionsRole
          aws-region: us-east-1
          role-session-name: SecurePipeGitHubActions

      - name: Verify AWS identity
        run: |
          set -e

          echo "AWS identity:"
          aws sts get-caller-identity

          echo "AWS region:"
          aws configure get region

          echo "OIDC authentication succeeded."
