name: AWS OIDC Test

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  aws-oidc-test:
    name: Verify GitHub OIDC Claims
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Inspect GitHub OIDC claims
        shell: bash
        run: |
          set -euo pipefail

          echo "Requesting GitHub OIDC token..."

          OIDC_RESPONSE=$(curl -sS \
            -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            -H "Accept: application/json; api-version=2.0" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com")

          OIDC_TOKEN=$(echo "$OIDC_RESPONSE" | jq -r '.value')

          if [ -z "$OIDC_TOKEN" ] || [ "$OIDC_TOKEN" = "null" ]; then
            echo "ERROR: GitHub did not return an OIDC token."
            exit 1
          fi

          echo "OIDC token received."

          PAYLOAD=$(echo "$OIDC_TOKEN" | cut -d '.' -f2)

          PAYLOAD=$(python3 -c '
          import base64
          import json
          import sys

          payload = sys.argv[1]
          payload += "=" * (-len(payload) % 4)

          decoded = base64.urlsafe_b64decode(payload)
          claims = json.loads(decoded)

          important = {
              "iss": claims.get("iss"),
              "aud": claims.get("aud"),
              "sub": claims.get("sub"),
              "repository": claims.get("repository"),
              "repository_id": claims.get("repository_id"),
              "repository_owner": claims.get("repository_owner"),
              "repository_owner_id": claims.get("repository_owner_id"),
              "ref": claims.get("ref"),
              "event_name": claims.get("event_name")
          }

          print(json.dumps(important, indent=2))
          ' "$PAYLOAD")

          echo "GitHub OIDC claims:"
          echo "$PAYLOAD"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: arn:aws:iam::854469103418:role/SecurePipeGitHubActionsRole
          aws-region: us-east-1
          role-session-name: SecurePipeGitHubActions

      - name: Verify AWS identity
        run: |
          set -e

          echo "AWS identity:"
          aws sts get-caller-identity

          echo "AWS region:"
          aws configure get region

          echo "OIDC authentication succeeded."
