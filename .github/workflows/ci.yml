name: SecurePipe CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run tests
        run: pytest -v

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Trivy filesystem vulnerability scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: "fs"
          scan-ref: "."
          scanners: "vuln"
          format: "sarif"
          output: "trivy-fs-results.sarif"
          exit-code: "0"

      - name: Upload Trivy report
        uses: actions/upload-artifact@v4
        with:
          name: trivy-filesystem-report
          path: trivy-fs-results.sarif
          retention-days: 7

  policy-gate:
    name: Policy Gate
    runs-on: ubuntu-latest

    needs:
      - test
      - security-scan

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Download Trivy report
        uses: actions/download-artifact@v4
        with:
          name: trivy-filesystem-report
          path: security-results

      - name: Run SecurePipe policy engine
        run: |
          python policy_engine.py \
            --sarif security-results/trivy-fs-results.sarif \
            --policy policies/container.json

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest

    needs:
      - policy-gate

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build --tag securepipe:${{ github.sha }} .

      - name: Save Docker image
        run: |
          docker save securepipe:${{ github.sha }} | gzip > securepipe-image.tar.gz

      - name: Upload Docker image
        uses: actions/upload-artifact@v4
        with:
          name: securepipe-docker-image
          path: securepipe-image.tar.gz
          retention-days: 1

  container-scan:
    name: Container Security Scan
    runs-on: ubuntu-latest

    needs:
      - docker-build

    permissions:
      contents: read

    steps:
      - name: Download Docker image
        uses: actions/download-artifact@v4
        with:
          name: securepipe-docker-image
          path: image

      - name: Load Docker image
        run: |
          gunzip -c image/securepipe-image.tar.gz | docker load

      - name: Run Trivy container vulnerability scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: "securepipe:${{ github.sha }}"
          scanners: "vuln"
          format: "sarif"
          output: "trivy-container-results.sarif"
          exit-code: "0"

      - name: Upload container Trivy report
        uses: actions/upload-artifact@v4
        with:
          name: trivy-container-report
          path: trivy-container-results.sarif
          retention-days: 7

  container-policy-gate:
    name: Container Policy Gate
    runs-on: ubuntu-latest

    needs:
      - container-scan

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Download container Trivy report
        uses: actions/download-artifact@v4
        with:
          name: trivy-container-report
          path: security-results

      - name: Run SecurePipe container policy
        run: |
          python policy_engine.py \
            --sarif security-results/trivy-container-results.sarif \
            --policy policies/container.json

  publish-image:
    name: Publish Image to Amazon ECR
    runs-on: ubuntu-latest

    needs:
      - container-policy-gate

    permissions:
      contents: read
      id-token: write

    env:
      AWS_REGION: us-east-1
      AWS_ACCOUNT_ID: "854469103418"
      ECR_REPOSITORY: securepipe

    steps:
      - name: Download Docker image
        uses: actions/download-artifact@v4
        with:
          name: securepipe-docker-image
          path: image

      - name: Load Docker image
        run: |
          gunzip -c image/securepipe-image.tar.gz | docker load

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: arn:aws:iam::854469103418:role/SecurePipeGitHubActionsRole
          aws-region: us-east-1
          role-session-name: SecurePipeECRPublish

      - name: Authenticate Docker to Amazon ECR
        run: |
          aws ecr get-login-password --region "$AWS_REGION" \
            | docker login \
              --username AWS \
              --password-stdin \
              "${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"

      - name: Tag image for Amazon ECR
        run: |
          docker tag \
            "securepipe:${GITHUB_SHA}" \
            "${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${ECR_REPOSITORY}:${GITHUB_SHA}"

      - name: Push image to Amazon ECR
        run: |
          docker push \
            "${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${ECR_REPOSITORY}:${GITHUB_SHA}"
