name: SecurePipe CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run tests
        run: pytest -v

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Trivy filesystem vulnerability scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: "fs"
          scan-ref: "."
          scanners: "vuln"
          format: "sarif"
          output: "trivy-fs-results.sarif"
          exit-code: "0"

      - name: Upload Trivy report
        uses: actions/upload-artifact@v4
        with:
          name: trivy-filesystem-report
          path: trivy-fs-results.sarif
          retention-days: 7

  policy-gate:
    name: Policy Gate
    runs-on: ubuntu-latest

    needs:
      - test
      - security-scan

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Download Trivy report
        uses: actions/download-artifact@v4
        with:
          name: trivy-filesystem-report
          path: security-results

      - name: Run SecurePipe policy engine
        run: |
          python policy_engine.py \
            --sarif security-results/trivy-fs-results.sarif \
            --policy policies/container.json

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest

    needs:
      - policy-gate

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build --tag securepipe:${{ github.sha }} .

      - name: Save Docker image
        run: |
          docker save securepipe:${{ github.sha }} | gzip > securepipe-image.tar.gz

      - name: Upload Docker image
        uses: actions/upload-artifact@v4
        with:
          name: securepipe-docker-image
          path: securepipe-image.tar.gz
          retention-days: 1

  container-scan:
    name: Container Security Scan
    runs-on: ubuntu-latest

    needs:
      - docker-build

    permissions:
      contents: read

    steps:
      - name: Download Docker image
        uses: actions/download-artifact@v4
        with:
          name: securepipe-docker-image
          path: image

      - name: Load Docker image
        run: |
          gunzip -c image/securepipe-image.tar.gz | docker load

      - name: Run Trivy container vulnerability scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: "securepipe:${{ github.sha }}"
          scanners: "vuln"
          format: "sarif"
          output: "trivy-container-results.sarif"
          exit-code: "0"

      - name: Upload container Trivy report
        uses: actions/upload-artifact@v4
        with:
          name: trivy-container-report
          path: trivy-container-results.sarif
          retention-days: 7

  container-policy-gate:
    name: Container Policy Gate
    runs-on: ubuntu-latest

    needs:
      - container-scan

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Download container Trivy report
        uses: actions/download-artifact@v4
        with:
          name: trivy-container-report
          path: security-results

      - name: Run SecurePipe container policy
        run: |
          python policy_engine.py \
            --sarif security-results/trivy-container-results.sarif \
            --policy policies/container.json

  publish-image:
    name: Publish Image to Amazon ECR
    runs-on: ubuntu-latest

    needs:
      - container-policy-gate

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: read
      id-token: write

    env:
      AWS_REGION: us-east-1
      AWS_ACCOUNT_ID: "854469103418"
      ECR_REPOSITORY: securepipe

    steps:
      - name: Download Docker image
        uses: actions/download-artifact@v4
        with:
          name: securepipe-docker-image
          path: image

      - name: Load Docker image
        run: |
          gunzip -c image/securepipe-image.tar.gz | docker load

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: arn:aws:iam::854469103418:role/SecurePipeGitHubActionsRole
          aws-region: us-east-1
          role-session-name: SecurePipeECRPublish

      - name: Authenticate Docker to Amazon ECR
        run: |
          aws ecr get-login-password --region "$AWS_REGION" \
            | docker login \
              --username AWS \
              --password-stdin \
              "${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"

      - name: Tag image for Amazon ECR
        run: |
          docker tag \
            "securepipe:${GITHUB_SHA}" \
            "${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${ECR_REPOSITORY}:${GITHUB_SHA}"

      - name: Push image to Amazon ECR
        run: |
          docker push \
            "${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${ECR_REPOSITORY}:${GITHUB_SHA}"

  deploy:
    name: Deploy to SecurePipe EC2
    runs-on: ubuntu-latest

    needs:
      - publish-image

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: read
      id-token: write

    env:
      AWS_REGION: us-east-1
      AWS_ACCOUNT_ID: "854469103418"
      ECR_REPOSITORY: securepipe
      EC2_INSTANCE_ID: i-041901a9f485c048f

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: arn:aws:iam::854469103418:role/SecurePipeGitHubActionsRole
          aws-region: us-east-1
          role-session-name: SecurePipeEC2Deploy

      - name: Deploy exact image through SSM
        id: deploy
        shell: bash
        run: |
          set -eu

          ECR_IMAGE="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${ECR_REPOSITORY}:${GITHUB_SHA}"

          echo "Deploying image:"
          echo "${ECR_IMAGE}"

          DEPLOY_SCRIPT=$(cat <<EOF
          set -eu

          ECR_IMAGE="${ECR_IMAGE}"
          STATE_FILE="/opt/securepipe/previous-image"

          mkdir -p "\$(dirname "\${STATE_FILE}")"

          echo "=== SecurePipe deployment started ==="
          echo "New image: \${ECR_IMAGE}"

          echo "Authenticating Docker to ECR..."
          aws ecr get-login-password --region "${AWS_REGION}" \
            | docker login \
              --username AWS \
              --password-stdin \
              "${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"

          echo "Pulling new image..."
          docker pull "\${ECR_IMAGE}"

          CURRENT_IMAGE=\$(docker inspect --format '{{.Config.Image}}' securepipe 2>/dev/null || true)

          if [ -z "\${CURRENT_IMAGE}" ]; then
            echo "ERROR: No currently running SecurePipe container found."
            exit 1
          fi

          echo "Current image: \${CURRENT_IMAGE}"

          echo "Saving current image as rollback target..."
          printf '%s\\n' "\${CURRENT_IMAGE}" > "\${STATE_FILE}"

          rollback() {
            echo "=== Starting automatic rollback ==="

            ROLLBACK_IMAGE=\$(cat "\${STATE_FILE}")

            if [ -z "\${ROLLBACK_IMAGE}" ]; then
              echo "ERROR: Rollback image is empty."
              exit 1
            fi

            echo "Rollback image: \${ROLLBACK_IMAGE}"

            docker rm -f securepipe 2>/dev/null || true

            echo "Starting rollback image..."
            docker run -d \
              --name securepipe \
              --restart unless-stopped \
              -p 8000:8000 \
              "\${ROLLBACK_IMAGE}"

            echo "Checking rollback health..."

            ROLLBACK_HEALTHY=false

            for attempt in $(seq 1 15); do
              echo "Rollback health check attempt \${attempt}/15..."

              if curl -fsS http://127.0.0.1:8000/health; then
                ROLLBACK_HEALTHY=true
                echo
                echo "Rollback image is healthy."
                break
              fi

              echo "Rollback application not ready yet. Waiting 2 seconds..."
              sleep 2
            done

            if [ "\${ROLLBACK_HEALTHY}" != "true" ]; then
              echo
              echo "ERROR: Rollback image failed health check."
              docker logs securepipe || true
              exit 1
            fi

            echo
            echo "=== Rollback successful ==="
          }

          echo "Stopping current container..."
          docker rm -f securepipe 2>/dev/null || true

          echo "Starting new image..."
          if ! docker run -d \
            --name securepipe \
            --restart unless-stopped \
            -p 8000:8000 \
            "\${ECR_IMAGE}"; then

            echo "ERROR: New container failed to start."
            rollback
            exit 1
          fi

          echo "Checking new deployment health..."

          HEALTHY=false

          for attempt in $(seq 1 15); do
            echo "Health check attempt \${attempt}/15..."

            if curl -fsS http://127.0.0.1:8000/health; then
              HEALTHY=true
              echo
              echo "New deployment is healthy."
              break
            fi

            echo "Application not ready yet. Waiting 2 seconds..."
            sleep 2
          done

          if [ "\${HEALTHY}" != "true" ]; then
            echo
            echo "ERROR: New deployment failed health check."

            docker logs securepipe || true

            rollback
            exit 1
          fi

          echo
          echo "=== SecurePipe deployment successful ==="
          echo "Running image: \${ECR_IMAGE}"
          echo "Rollback image: \${CURRENT_IMAGE}"
          EOF
          )

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${EC2_INSTANCE_ID}" \
            --document-name "AWS-RunShellScript" \
            --parameters "$(jq -n --arg script "${DEPLOY_SCRIPT}" '{commands: [$script]}')" \
            --query 'Command.CommandId' \
            --output text)

          echo "SSM command ID: ${COMMAND_ID}"

          for attempt in $(seq 1 30); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "${COMMAND_ID}" \
              --instance-id "${EC2_INSTANCE_ID}" \
              --query 'Status' \
              --output text)

            echo "SSM status attempt ${attempt}: ${STATUS}"

            case "${STATUS}" in
              Success)
                echo "SSM deployment completed successfully."
                break
                ;;

              Failed|Cancelled|TimedOut|Cancelling)
                echo "SSM deployment failed."

                echo "----- STDOUT -----"
                aws ssm get-command-invocation \
                  --command-id "${COMMAND_ID}" \
                  --instance-id "${EC2_INSTANCE_ID}" \
                  --query 'StandardOutputContent' \
                  --output text

                echo "----- STDERR -----"
                aws ssm get-command-invocation \
                  --command-id "${COMMAND_ID}" \
                  --instance-id "${EC2_INSTANCE_ID}" \
                  --query 'StandardErrorContent' \
                  --output text

                exit 1
                ;;

              *)
                sleep 5
                ;;
            esac

            if [ "${attempt}" -eq 30 ]; then
              echo "Timed out waiting for SSM command."

              echo "----- STDOUT -----"
              aws ssm get-command-invocation \
                --command-id "${COMMAND_ID}" \
                --instance-id "${EC2_INSTANCE_ID}" \
                --query 'StandardOutputContent' \
                --output text

              echo "----- STDERR -----"
              aws ssm get-command-invocation \
                --command-id "${COMMAND_ID}" \
                --instance-id "${EC2_INSTANCE_ID}" \
                --query 'StandardErrorContent' \
                --output text

              exit 1
            fi
          done

      - name: Verify deployment result
        run: |
          set -euo pipefail

          echo "SecurePipe deployment completed."
          echo "Deployed image:"
          echo "${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com/${ECR_REPOSITORY}:${GITHUB_SHA}"
